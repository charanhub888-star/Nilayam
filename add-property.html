<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Property | Nilayam</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="dashboard-header">

    <h1>🏠 Add New Property</h1>

</header>

<section class="add-property">

<div class="form-container">

<form id="propertyForm">

<div class="form-row">

<div class="form-group">
<label>Property Title</label>
<input type="text" id="title" placeholder="2BHK Apartment" required>
</div>

<div class="form-group">
<label>Property Type</label>
<select required>
<option>Select Property Type</option>
<option>Apartment</option>
<option>House</option>
<option>PG</option>
<option>Single Room</option>
<option>Villa</option>
</select>
</div>

</div>

<div class="form-row">

<div class="form-group">
<label>City</label>
<input type="text" id="city" placeholder="Hyderabad" required>
</div>

<div class="form-group">
<label>District</label>
<input type="text" id="district" placeholder="Ranga Reddy" required>
</div>

</div>

<div class="form-row">

<div class="form-group">
<label>Monthly Rent</label>
<input type="number" id="rent" placeholder="8000" required>
</div>

<div class="form-group">
<label>Bedrooms</label>
<input type="number" id="bedrooms" placeholder="2">
</div>

</div>

<div class="form-row">

<div class="form-group">
<label>Bathrooms</label>
<input type="number" placeholder="2">
</div>

<div class="form-group">
<label>Owner Contact</label>
<input type="tel" id="contact" placeholder="+91 1234567890" required>
</div>

</div>

<div class="form-group">

<label>Property Image</label>

<input type="file" id="propertyImage" accept="image/*">
<br><br>

<img id="imagePreview"
     src=""
     alt="Preview"
     style="display:none; width:300px; border-radius:10px;">

</div>

<div class="form-group">

<label>Description</label>

<textarea id="description" rows="5" placeholder="Describe your property..."></textarea>
</div>

<button type="submit" class="submit-btn">

➕ Add Property

</button>

</form>

</div>

</section>

<script src="js/script.js"></script>

</body>

</html>
